name: yt-auth-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exchange refresh token and read channel
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.parse, urllib.error
          cid = os.environ["YOUTUBE_CLIENT_ID"]
          sec = os.environ["YOUTUBE_CLIENT_SECRET"]
          rtk = os.environ["YOUTUBE_REFRESH_TOKEN"]
          print("VALUE LENGTHS id/secret/refresh:", len(cid), len(sec), len(rtk))
          data = urllib.parse.urlencode({
              "client_id": cid,
              "client_secret": sec,
              "refresh_token": rtk,
              "grant_type": "refresh_token"}).encode()
          try:
              tok = json.load(urllib.request.urlopen(
                  "https://oauth2.googleapis.com/token", data))["access_token"]
          except urllib.error.HTTPError as e:
              print("TOKEN EXCHANGE FAILED:", e.code,
                    e.read().decode(errors="replace"))
              raise SystemExit(1)
          print("ACCESS TOKEN OK")
          req = urllib.request.Request(
              "https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true",
              headers={"Authorization": f"Bearer {tok}"})
          ch = json.load(urllib.request.urlopen(req))
          items = ch.get("items", [])
          print("CHANNEL:", items[0]["snippet"]["title"] if items else "NONE")
          EOF
